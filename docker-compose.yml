services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lucas_aqua_life
      POSTGRES_USER: lucas
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucas -d lucas_aqua_life"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
